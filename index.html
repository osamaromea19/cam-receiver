<!DOCTYPE html>
<html>
<head>
    <title>Camera Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            margin: 0 auto;
        }
        #receivedImage {
            max-width: 100%;
            border: 3px solid white;
            border-radius: 10px;
            margin: 20px 0;
            background: black;
            min-height: 300px;
            display: none;
        }
        .placeholder {
            color: #ccc;
            font-style: italic;
            padding: 50px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 10px;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
        }
        .info-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Camera Receiver</h1>
        <p>Live images from: <strong>cam-sender-steel.vercel.app</strong></p>
        
        <div class="status" id="status">Waiting for connection from sender...</div>
        
        <div id="imageContainer">
            <img id="receivedImage" src="" alt="Received image will appear here">
            <div id="placeholder" class="placeholder">No image received yet</div>
        </div>
        
        <div class="info-box">
            <div class="info-item">Last received: <span id="lastTime">Never</span></div>
            <div class="info-item">Total received: <span id="totalReceived">0</span></div>
            <div class="info-item">Image size: <span id="imageSize">0 KB</span></div>
            <div class="info-item">Frame number: <span id="frameNumber">-</span></div>
        </div>
        
        <div>
            <button onclick="clearImages()">Clear Display</button>
            <button onclick="openSender()">Open Sender</button>
            <button onclick="toggleAutoRefresh()" id="refreshBtn">Enable Auto-Refresh</button>
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
            <p>This page will automatically show images when they are sent from the camera site.</p>
        </div>
    </div>

    <script>
        // Configuration - USING YOUR ACTUAL SENDER URL
        const SENDER_URL = "https://cam-sender-steel.vercel.app";
        
        let totalReceived = 0;
        let autoRefreshInterval = null;
        let isAutoRefresh = false;
        
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? 'rgba(255, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.3)';
        }
        
        function displayImage(imageData, frameNumber = 'Unknown') {
            const imgElement = document.getElementById('receivedImage');
            const placeholder = document.getElementById('placeholder');
            
            imgElement.src = imageData;
            imgElement.style.display = 'block';
            placeholder.style.display = 'none';
            
            // Update info
            totalReceived++;
            const currentTime = new Date();
            document.getElementById('lastTime').textContent = currentTime.toLocaleTimeString();
            document.getElementById('totalReceived').textContent = totalReceived;
            document.getElementById('frameNumber').textContent = frameNumber;
            
            // Calculate image size
            const sizeKB = Math.round((imageData.length * 0.75) / 1024);
            document.getElementById('imageSize').textContent = sizeKB + ' KB';
            
            updateStatus(`✅ Image #${frameNumber} received (${sizeKB} KB)`);
        }
        
        function clearImages() {
            const imgElement = document.getElementById('receivedImage');
            const placeholder = document.getElementById('placeholder');
            
            imgElement.src = '';
            imgElement.style.display = 'none';
            placeholder.style.display = 'block';
            
            updateStatus("Display cleared - waiting for new images");
        }
        
        function openSender() {
            window.open(SENDER_URL, '_blank');
        }
        
        function toggleAutoRefresh() {
            const button = document.getElementById('refreshBtn');
            
            if (isAutoRefresh) {
                // Stop auto-refresh
                clearInterval(autoRefreshInterval);
                isAutoRefresh = false;
                button.textContent = 'Enable Auto-Refresh';
                button.style.background = '#2196F3';
                updateStatus("Auto-refresh disabled");
            } else {
                // Start auto-refresh (every 5 seconds)
                autoRefreshInterval = setInterval(() => {
                    checkForImageFromURL();
                }, 5000);
                isAutoRefresh = true;
                button.textContent = 'Disable Auto-Refresh';
                button.style.background = '#f5576c';
                updateStatus("Auto-refresh enabled - checking every 5 seconds");
            }
        }
        
        function checkForImageFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const imageData = urlParams.get('image');
            const frameNumber = urlParams.get('frame') || 'URL';
            
            if (imageData) {
                displayImage(imageData, frameNumber);
                
                // Clean URL but keep functionality
                if (history.replaceState) {
                    const cleanURL = window.location.pathname;
                    history.replaceState(null, '', cleanURL);
                }
            }
        }
        
        // Listen for messages from the sender window
        window.addEventListener('message', function(event) {
            // Verify the message is from our sender
            if (event.origin === SENDER_URL) {
                if (event.data.type === 'newImage') {
                    displayImage(event.data.image, event.data.frameNumber);
                }
            }
        });
        
        // Check for image on page load (from URL parameters)
        window.addEventListener('load', function() {
            checkForImageFromURL();
            updateStatus("Ready - waiting for images from: " + SENDER_URL);
        });
        
        // Also check when page becomes visible
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                checkForImageFromURL();
            }
        });
    </script>
</body>
</html>
